{% extends "base.html" %}
{% block title %}Dashboard - Smart Parking{% endblock %}

{% block content %}
<h2 class="mb-4 fw-bold">Smart Parking Dashboard</h2>

<div id="dashboardContent">
  <div class="text-muted">Loading dashboard...</div>
</div>

<div class="card-section mt-4">
  <h5 class="mb-3">Quick Occupancy Trend (last records)</h5>
  <canvas id="trendChart" height="90"></canvas>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadDashboard() {
  const el = document.getElementById("dashboardContent");
  try {
    const data = await fetchJson("/api/dashboard");

    if (!data.has_data) {
      el.innerHTML = `<div class="alert alert-info">${data.message}</div>`;
      return;
    }

    const latest = data.latest;

    el.innerHTML = `
      <div class="row g-3">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-value">${latest.total_slots}</div>
            <div class="stat-label">Total Slots</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-value">${latest.occupied_slots}</div>
            <div class="stat-label">Occupied</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-value">${latest.available_slots}</div>
            <div class="stat-label">Available</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-value">${latest.occupancy_percentage}%</div>
            <div class="stat-label">Occupancy</div>
          </div>
        </div>
      </div>

      <div class="card-section mt-4 text-center">
        <div class="text-muted mb-2">
          Latest record: ${latest.parking_area} &middot; ${latest.date} ${latest.time}
        </div>
        <div class="mb-2">Current Status</div>
        ${statusBadgeHtml(latest.status)}
        <div class="mt-3 text-muted">
          Overall average occupancy across ${data.total_records} records:
          <strong>${data.average_occupancy}%</strong>
        </div>
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
}

async function loadTrendChart() {
  try {
    const rows = await fetchJson("/api/parking"); // most recent 100, newest first
    const recent = rows.slice(0, 20).reverse();

    const labels = recent.map(r => `${r.date} ${r.time}`);
    const values = recent.map(r => r.occupancy_percentage);

    new Chart(document.getElementById("trendChart"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Occupancy %",
          data: values,
          borderColor: "#2563eb",
          backgroundColor: "rgba(37,99,235,0.15)",
          tension: 0.3,
          fill: true,
        }]
      },
      options: {
        scales: { y: { min: 0, max: 100 } }
      }
    });
  } catch (err) {
    console.error(err);
  }
}

loadDashboard();
loadTrendChart();
</script>
{% endblock %}
