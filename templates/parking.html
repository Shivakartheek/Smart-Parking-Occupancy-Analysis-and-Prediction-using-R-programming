{% extends "base.html" %}
{% block title %}Parking Data - Smart Parking{% endblock %}

{% block content %}
<h2 class="mb-4 fw-bold">Parking Data Entry</h2>

<div class="card-section">
  <div id="formAlert"></div>
  <form id="parkingForm" class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Date</label>
      <input type="date" class="form-control" name="date" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Day</label>
      <select class="form-select" name="day" required>
        <option value="">Select day</option>
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
        <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Time</label>
      <input type="time" class="form-control" name="time" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Total Slots</label>
      <input type="number" class="form-control" name="total_slots" min="1" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Occupied Slots</label>
      <input type="number" class="form-control" name="occupied_slots" min="0" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Parking Area</label>
      <input type="text" class="form-control" name="parking_area" placeholder="e.g. Block A" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Weather</label>
      <select class="form-select" name="weather" required>
        <option value="">Select weather</option>
        <option>Normal</option><option>Rainy</option><option>Hot</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Event Happening?</label>
      <select class="form-select" name="event" required>
        <option value="">Select</option>
        <option>Yes</option><option>No</option>
      </select>
    </div>
    <div class="col-md-4 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">Add Record</button>
    </div>
  </form>
</div>

<div class="card-section">
  <h5 class="mb-3">Recent Records</h5>
  <div class="table-responsive">
    <table class="table table-sm table-hover align-middle">
      <thead>
        <tr>
          <th>Date</th><th>Day</th><th>Time</th><th>Area</th>
          <th>Total</th><th>Occupied</th><th>Available</th>
          <th>Occupancy %</th><th>Weather</th><th>Event</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="parkingTableBody">
        <tr><td colspan="11" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function statusFor(pct) {
  if (pct <= 40) return "LOW";
  if (pct <= 70) return "MEDIUM";
  return "HIGH";
}

async function loadTable() {
  const body = document.getElementById("parkingTableBody");
  try {
    const rows = await fetchJson("/api/parking");
    if (rows.length === 0) {
      body.innerHTML = `<tr><td colspan="11" class="text-muted">No records yet.</td></tr>`;
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr>
        <td>${r.date}</td><td>${r.day}</td><td>${r.time}</td><td>${r.parking_area}</td>
        <td>${r.total_slots}</td><td>${r.occupied_slots}</td><td>${r.total_slots - r.occupied_slots}</td>
        <td>${r.occupancy_percentage}%</td><td>${r.weather}</td><td>${r.event}</td>
        <td>${statusBadgeHtml(statusFor(r.occupancy_percentage))}</td>
      </tr>
    `).join("");
  } catch (err) {
    body.innerHTML = `<tr><td colspan="11" class="text-danger">${err.message}</td></tr>`;
  }
}

document.getElementById("parkingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("formAlert");
  alertBox.innerHTML = "";

  const form = e.target;
  const formData = new FormData(form);

  // Convert the date from yyyy-mm-dd (HTML input) to dd-mm-yyyy for display,
  // and the day is already picked explicitly by the user above.
  const rawDate = formData.get("date");
  const [yyyy, mm, dd] = rawDate.split("-");
  const displayDate = `${dd}-${mm}-${yyyy}`;

  const payload = {
    date: displayDate,
    day: formData.get("day"),
    time: formData.get("time"),
    total_slots: formData.get("total_slots"),
    occupied_slots: formData.get("occupied_slots"),
    weather: formData.get("weather"),
    event: formData.get("event"),
    parking_area: formData.get("parking_area"),
  };

  try {
    const result = await fetchJson("/api/add-parking", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    alertBox.innerHTML = `<div class="alert alert-success">
      Record added! Occupancy: ${result.occupancy_percentage}% (${result.status})
    </div>`;
    form.reset();
    loadTable();
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
});

loadTable();
</script>
{% endblock %}
